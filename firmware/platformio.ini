[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall

; Alternative driver build only; choose by the actual panel label, not PCB version.
[env:cores3_legacy_epaper]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DRADIO_EPD_LEGACY=1
